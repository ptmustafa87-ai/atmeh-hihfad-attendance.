<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14b8a6"><title>HIFAD – الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e9f7f5;--bg2:#f8fcfb;--card:rgba(255,255,255,.82);--tx:#15302e;--mu:#6a8683;--pr:#14b8a6;--pr2:#0d8f82;--soft:#d9f2ee;--out:#f08a5d;--out2:#d96b3c;--ok:#16a34a;--bad:#e5484d;--bd:rgba(20,184,166,.18)}
@media(prefers-color-scheme:dark){:root{--bg1:#0c1b1a;--bg2:#10241f;--card:rgba(24,44,42,.8);--tx:#e6f4f2;--mu:#8fb3af;--soft:#173532;--bd:rgba(76,214,200,.18)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 36px}
.head{display:flex;align-items:center;justify-content:space-between;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:10px 16px}
.head img{height:34px}.head small{color:var(--mu);font-size:12px}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:26px;padding:22px;margin-top:14px;box-shadow:0 10px 30px rgba(20,184,166,.10)}
.hi{font-size:20px;font-weight:800}.mu{color:var(--mu);font-size:13px}.c{text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;border:0;font-family:inherit;cursor:pointer}
.chip.in{background:#dcfce7;color:#166534}.chip.out{background:#fee2e2;color:#991b1b}.chip.un{background:var(--soft);color:var(--mu)}
.clock{font-size:46px;font-weight:800;direction:ltr;text-align:center;line-height:1.1;margin-top:8px}
.orb{position:relative;width:210px;height:210px;margin:18px auto 6px}
.orb svg{position:absolute;inset:0;transform:rotate(-90deg)}
.orb .tr{stroke:var(--soft)}.orb .pg{stroke:var(--pr);transition:stroke-dashoffset .8s}
.go{position:absolute;inset:18px;border-radius:50%;border:0;color:#fff;font-family:inherit;font-weight:800;font-size:22px;cursor:pointer;background:linear-gradient(145deg,var(--pr),var(--pr2));box-shadow:0 12px 28px rgba(20,184,166,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.go:active{transform:scale(.95)}.go.out{background:linear-gradient(145deg,var(--out),var(--out2));box-shadow:0 12px 28px rgba(240,138,93,.45)}.go:disabled{opacity:.7}
.go small{font-size:12px;font-weight:600;opacity:.9}
.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--pr);animation:p 2.2s infinite}
@keyframes p{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.18);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.st{background:var(--soft);border-radius:16px;padding:11px 6px;text-align:center}.st b{display:block;font-size:16px}.st span{font-size:11px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:inherit;font-size:16px}
.opts{display:flex;gap:8px}.opt{flex:1;padding:12px 6px;border-radius:14px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font:inherit;cursor:pointer;text-align:center;font-size:14px}
.opt.on{border-color:var(--pr);background:var(--soft);color:var(--pr2);font-weight:800}
.btn{width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;background:linear-gradient(145deg,var(--pr),var(--pr2));color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(10,30,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--bg2);width:100%;max-width:460px;border-radius:28px 28px 0 0;padding:28px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;animation:up .35s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet .em{font-size:46px}.sheet h2{margin:6px 0;font-size:21px}.sheet p{margin:6px 0;line-height:1.9;color:var(--mu)}
.ghost{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:14px}
[hidden]{display:none!important}
</style></head><body><div class="wrap">

const save=()=>{try{localStorage.setItem('hifad',JSON.stringify(S))}catch(e){}};
let pos=null,mode='shift',tk=null;
const fT=t=>new Date(t).toLocaleTimeString('ar-u-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:CFG.TZ});
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>{const o={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};o.dist=Math.round(dist(o.lat,o.lng,CFG.LAT,CFG.LNG));o.inside=o.dist<=CFG.RADIUS+Math.min(o.acc,50);r(o)},()=>r(null),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function geoUI(){const g=$('#geo');if(!pos){g.className='chip un';g.textContent='📍 الموقع غير متاح – اضغط للتفعيل'}else if(pos.inside){g.className='chip in';g.textContent='✅ أنت داخل نطاق المشفى'}else{g.className='chip out';g.textContent='⚠️ أنت خارج نطاق المشفى ('+pos.dist+' م)'}}
async function refreshGeo(){$('#geo').textContent='📍 جارٍ تحديد الموقع…';pos=await getPos();geoUI()}
async function flush(){if(!CFG.SCRIPT_URL||!navigator.onLine)return;for(const ev of [...S.q]){try{await fetch(CFG.SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(ev)});S.q=S.q.filter(x=>x!==ev&&!(x.sid==ev.sid&&x.type==ev.type));save()}catch(e){break}}}
function send(type,ts,p,m){S.q.push({sid:S.sess.sid,type,no:S.me.no,name:S.me.name,job:S.me.job,mode:m,ts,lat:p?p.lat:'',lng:p?p.lng:'',acc:p?p.acc:'',dist:p?p.dist:'',inside:p?(p.inside?'داخل النطاق':'خارج النطاق'):'الموقع غير متاح'});save();flush()}
function monthHrs(){const n=Z(Date.now()),k=n.year+'-'+n.month;let h=0;S.log.forEach(l=>{const d=Z(l.inTs);if(d.year+'-'+d.month==k)h+=(l.outTs-l.inTs)/36e5});if(S.sess&&S.sess.active)h+=(Date.now()-S.sess.inTs)/36e5;return h}
function tick(){const n=Z(Date.now());$('#clk').textContent=pad(n.hour)+':'+pad(n.minute)+':'+pad(n.second);$('#dt').textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long',timeZone:CFG.TZ});
 if(S.sess&&S.sess.active){const s=Math.floor((Date.now()-S.sess.inTs)/1000);$('#s2').textContent=Math.floor(s/3600)+'س '+pad(Math.floor(s%3600/60))+'د';$('#pg').style.strokeDashoffset=603.2*(1-Math.min(1,s/3600/TARGET[S.sess.mode]))}$('#s3').textContent=monthHrs().toFixed(1)}
function render(){if(!S.me){$('#setup').hidden=false;$('#home').hidden=true;return}
 $('#setup').hidden=true;$('#home').hidden=false;const h=Z(Date.now()).hour,a=S.sess&&S.sess.active;
 $('#hi').textContent=(h<12?'صباح الخير ':'مساء الخير ')+S.me.name.split(' ')[0]+' 🌿';$('#who').textContent=S.me.job+' • '+T[S.me.type];
 $('#mp').hidden=S.me.type!=='both'||a;$('#go').className='go'+(a?' out':'');$('#orb').classList.toggle('pulse',!a);
 $('#go').innerHTML=a?'انصراف<small>اضغط عند المغادرة</small>':'حضور<small>اضغط للتسجيل</small>';
 $('#s1').textContent=a?fT(S.sess.inTs):'--';if(!a){$('#s2').textContent='--';$('#pg').style.strokeDashoffset=603.2}
 clearInterval(tk);tick();tk=setInterval(tick,1000)}
function modal(e,t,p){$('#em').textContent=e;$('#h2').textContent=t;$('#pp').innerHTML=p;$('#sh').hidden=false}
$('#ok').onclick=()=>$('#sh').hidden=true;$('#geo').onclick=refreshGeo;
$('#fT').onclick=e=>{const b=e.target.closest('.opt');if(b)document.querySelectorAll('#fT .opt').forEach(c=>c.classList.toggle('on',c==b))};
$('#mO').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;mode=b.dataset.v;document.querySelectorAll('#mO .opt').forEach(c=>c.classList.toggle('on',c==b))};
$('#fS').onclick=()=>{const t=document.querySelector('#fT .opt.on'),m={name:$('#fN').value.trim(),job:$('#fJ').value.trim(),no:$('#fI').value.trim(),type:t&&t.dataset.v};if(!m.name||!m.job||!m.no||!m.type){$('#fE').textContent='يرجى تعبئة كل الحقول واختيار طبيعة الدوام';return}S.me=m;save();render();refreshGeo()};
$('#ed').onclick=()=>{const m=S.me;$('#fN').value=m.name;$('#fJ').value=m.job;$('#fI').value=m.no;document.querySelectorAll('#fT .opt').forEach(c=>c.classList.toggle('on',c.dataset.v==m.type));$('#setup').hidden=false;$('#home').hidden=true};
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;const a=S.sess&&S.sess.active;b.innerHTML='جارٍ تحديد موقعك…';
 const p=await getPos();pos=p;geoUI();const now=Date.now(),bad=!p||!p.inside,bx='<div style="background:#fee2e2;color:#991b1b;border-radius:14px;padding:11px;margin-top:12px;font-weight:600;line-height:1.7">⚠️ تنبيه: ',where=p?(p.inside?'':bx+'سُجّل من خارج نطاق المشفى (يبعد '+p.dist+' م).<br>تم حفظ التسجيل وستظهر ملاحظة للإدارة.</div>'):bx+'تعذّر تحديد موقعك.<br>تم حفظ التسجيل وستظهر ملاحظة للإدارة.</div>';
 if(!a){const m=S.me.type==='both'?mode:S.me.type;S.sess={active:true,sid:S.me.no+'_'+now,inTs:now,mode:m};send('in',now,p,m);b.disabled=false;render();
  modal(bad?'⚠️':'🌸','أهلاً بك يا '+S.me.name.split(' ')[0],'تم تسجيل حضورك الساعة <b>'+fT(now)+'</b><br>نتمنى لك يوم عمل هادئاً ومباركاً'+where)}
 else{const s=S.sess,mins=Math.floor((now-s.inTs)/6e4);send('out',now,p,s.mode);S.log.push({inTs:s.inTs,outTs:now});S.log=S.log.slice(-70);S.sess={active:false};save();b.disabled=false;render();
  const w=['شكراً لجهودك، الله يعطيك العافية 🌸','نتمنى لك وصولاً آمناً وراحة هانئة 💙','تعبك مقدَّر.. استرح جيداً وعد إلينا بنشاط 🌿','سلامتك وسلامة أهلك، دمت بخير ✨'];
  modal(bad?'⚠️':'🌙','إلى اللقاء '+S.me.name.split(' ')[0],'تم تسجيل انصرافك الساعة <b>'+fT(now)+'</b><br>قضيت <b>'+Math.floor(mins/60)+' ساعة و '+mins%60+' دقيقة</b><br>'+w[Math.floor(Math.random()*w.length)]+where)}};
if(location.hash=='#loc'){$('#lc').hidden=false;$('#lc').onclick=async()=>{const p=await getPos();modal('📍','إحداثياتك الحالية',p?p.lat.toFixed(6)+' , '+p.lng.toFixed(6):'غير متاح')}}
addEventListener('online',flush);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();flush();if(S.me)refreshGeo();
</script></body></html>
